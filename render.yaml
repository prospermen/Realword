services:
  - type: web
    name: copy-project-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/dev.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
